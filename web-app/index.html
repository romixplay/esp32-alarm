<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNTITLED // SAFE</title>
    <link rel="icon" href="data:,">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <style>
        :root { --bg: #f4f4f4; --text: #000; --terminal-bg: #111; --terminal-text: #0f0; --accent: #d32f2f; }
        
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        input, .terminal { -webkit-user-select: text; user-select: text; } 
        
        body { font-family: monospace; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; }
        #auth-screen input { padding: 10px; font-family: monospace; font-size: 1.2rem; text-align: center; border: 2px solid white; background: black; color: white; width: 200px; margin-bottom: 15px; }
        #auth-screen button { padding: 10px 20px; font-family: monospace; font-size: 1rem; cursor: pointer; background: white; color: black; border: none; font-weight: bold; }
        
        .container { max-width: 500px; width: 100%; display: none; }
        
        /* NEW HEADER LAYOUT */
        .header-container { display: flex; flex-direction: column; width: 100%; border-bottom: 3px solid var(--text); padding-bottom: 15px; margin-bottom: 20px; }
        .header-title { font-size: 1.4rem; letter-spacing: 2px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-left { display: flex; gap: 10px; align-items: center; }
        .header-right { display: flex; align-items: center; }
        
        .status-badge { padding: 5px 10px; font-weight: bold; border: 2px solid #000; font-size: 0.8rem; }
        .bg-grey { background-color: #ccc; color: #000; }
        .bg-green { background-color: #0f0; color: #000; }
        .bg-red { background-color: #f00; color: #fff; }

        .card { border: 2px solid var(--text); padding: 15px; margin-bottom: 20px; background: #fff; box-shadow: 4px 4px 0px var(--text); }
        .card label { font-weight: bold; display: block; margin-bottom: 10px; text-transform: uppercase; }
        
        input[type="range"] { width: 100%; cursor: pointer; margin-bottom: 10px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 10px 2px; font-family: monospace; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-outline:active { background: var(--accent); color: white; }
        .btn-solid { background: #000; color: #fff; border: 2px solid #000; padding: 15px; font-family: monospace; font-weight: bold; width: 100%; cursor: pointer; text-align: center; }
        .btn-solid:active { background: #333; }
        
        .btn-magic { background: #fff; border: 2px solid #000; color: #000; font-weight: bold; font-family: monospace; padding: 5px 10px; cursor: pointer; font-size: 0.8rem;}
        .btn-magic:active { background: #000; color: #fff; }

        .switch-container { display: flex; align-items: center; gap: 10px; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 22px; border: 2px solid #000; }
        .slider-toggle:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-toggle { background-color: #0f0; }
        input:checked + .slider-toggle:before { transform: translateX(18px); }

        details { padding: 10px; background: #fafafa; border: 1px dashed var(--text); margin-top: 15px; }
        summary { font-weight: bold; cursor: pointer; outline: none; text-transform: uppercase; }
        
        .terminal { background-color: var(--terminal-bg); color: var(--terminal-text); padding: 1rem; font-size: 0.85rem; height: 150px; overflow-y: auto; border: 2px solid var(--text); margin-bottom: 15px; }
        .version-text { font-size: 0.9rem; font-weight: bold; color: #444; text-align: center; margin-top: 15px; }
        
        /* AUDIO LIBRARY GRID */
        #slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .slot-card { background: #f9f9f9; border: 2px solid #333; padding: 10px; text-align: center; display: flex; flex-direction: column; }
        .slot-card h4 { margin: 0 0 10px 0; font-size: 0.85rem; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-main-play { width: 100%; height: 40px; margin-bottom: 8px; background: white; border: 2px solid black; font-family: monospace; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn-main-play:active { background: #000; color: #fff; }

        .slot-controls { display: flex; justify-content: space-between; gap: 5px; flex-grow: 1; align-items: stretch; }
        .btn-sm { 
            flex: 1 1 0; 
            height: 32px; box-sizing: border-box; margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.65rem; background: #333; color: white; border: none; cursor: pointer; font-family: monospace; font-weight: bold; 
        }
        .btn-sm.mic-btn { background: #555; }
        .btn-sm.del-btn { background: #a00; }
        .btn-sm.play-btn { background: #0055ff; }
        .btn-sm:active { opacity: 0.7; }
        
        /* The CSS trick to fix the UPLOAD label alignment */
        .btn-sm-label { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; cursor: pointer; }
        
        .icon-btn { cursor: pointer; font-size: 1rem; background: #eee; border: 1px solid #ccc; padding: 2px 5px; border-radius: 3px; margin-left: 3px; }
        
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .input-group input[type="number"] { width: 80px; padding: 5px; font-family: monospace; font-size: 0.9rem; box-sizing: border-box; text-align: center;}
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2>ENTER SYSTEM PASSCODE</h2>
        <input type="password" id="passcode-input" placeholder="****" onkeypress="if(event.key === 'Enter') login()">
        <button id="auth-btn" onclick="login()">AUTHENTICATE</button>
        <p id="auth-error" style="color: red; display: none; margin-top:10px;">INVALID PASSCODE</p>
    </div>

    <div class="container" id="main-app">
        
        <div class="header-container">
            <div class="header-title">UNTITLED~CAFE // SAFE</div>
            <div class="header-row">
                <div class="header-left">
                    <button class="btn-magic" onclick="magicRefresh()">↻ REFRESH</button>
                    <div class="switch-container">
                        <label class="switch" title="HARDWARE AMP POWER"><input type="checkbox" id="amp-toggle" checked onchange="saveSettings()"><span class="slider-toggle"></span></label>
                        <span>AMP</span>
                    </div>
                </div>
                <div class="header-right">
                    <span id="status-indicator" class="status-badge bg-grey">CONNECTING</span>
                </div>
            </div>
        </div>

        <div class="card">
            <label>MANUAL ALARM TRIGGER</label>
            <div class="btn-grid">
                <button class="btn-outline" onclick="triggerAlarm(3)">SOUND ALARM 3 SEC</button>
                <button class="btn-outline" onclick="triggerAlarm(5)">SOUND ALARM 5 SEC</button>
                <button class="btn-outline" onclick="triggerAlarm(10)">SOUND ALARM 10 SEC</button>
                <button class="btn-outline" onclick="triggerAlarm(30)">SOUND ALARM 30 SEC</button>
            </div>
            <div class="btn-grid">
                <button class="btn-solid" onmousedown="holdAlarm(true)" onmouseup="holdAlarm(false)" onmouseleave="holdAlarm(false)" ontouchstart="holdAlarm(true)" ontouchend="holdAlarm(false)">HOLD TO PLAY</button>
                <button class="btn-solid" style="background: var(--accent); border-color: var(--accent);" onclick="stopAlarm()">STOP</button>
            </div>

            <details>
                <summary>ADVANCED SIREN SETTINGS</summary>
                <div style="margin-top: 15px;">
                    <label>SIREN VOLUME: <span id="vol-val">50%</span></label>
                    <input type="range" id="volume" min="0" max="100" value="50" onchange="saveSettings()">

                    <label style="margin-top: 15px;">SIREN MIN FREQUENCY: <span id="smin-val">800Hz</span></label>
                    <input type="range" id="siren-min" min="300" max="2500" step="50" value="800" onchange="saveSettings()">
                    
                    <label style="margin-top: 10px;">SIREN MAX FREQUENCY: <span id="smax-val">1600Hz</span></label>
                    <input type="range" id="siren-max" min="300" max="2500" step="50" value="1600" onchange="saveSettings()">
                    
                    <label style="margin-top: 10px;">SIREN SWEEP SPEED: <span id="sspeed-val">10</span></label>
                    <input type="range" id="siren-speed" min="1" max="50" value="10" onchange="saveSettings()">

                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--text);">
                        <div class="switch-container">
                            <label class="switch"><input type="checkbox" id="wobble-toggle" onchange="saveSettings()"><span class="slider-toggle"></span></label>
                            <span>ENABLE WOBBLE EFFECT (LFO)</span>
                        </div>
                        <label>WOBBLE SPEED: <span id="wspeed-val">15</span></label>
                        <input type="range" id="wobble-speed" min="1" max="50" value="15" onchange="saveSettings()">
                    </div>
                </div>
            </details>
        </div>

        <div class="card">
            <label style="margin-bottom: 5px;">AUDIO LIBRARY (MAX 10S PER SLOT)</label>
            
            <label style="color: var(--accent); margin-top: 10px;">AUDIO VOLUME: <span id="wvol-val">50%</span></label>
            <input type="range" id="wav-volume" min="0" max="100" value="50" onchange="saveSettings()" style="margin-bottom: 20px;">
            
            <div id="slot-grid">
                
                <div class="slot-card" style="grid-column: 1 / -1; border-color: var(--accent); border-width: 3px;">
                    <h4 style="color: var(--accent); font-size: 1rem;">
                        <span id="name-slot0">JAMAICAN HORN (SLOT 0)</span> 
                        <span class="icon-btn" onclick="renameSlot(0)" title="Rename Slot">✏️</span>
                    </h4>
                    <button id="btn-play-0" onclick="triggerSlot(0)" class="btn-main-play" style="height: 50px; background: var(--accent); color: white; font-size: 1.1rem;">PLAY</button>
                    <div class="slot-controls">
                        <label class="btn-sm"><div class="btn-sm-label">UPLOAD NEW<input type="file" hidden accept="audio/mp3, audio/wav, audio/m4a, audio/x-m4a, audio/aac" onchange="uploadToSlot(event, 0)"></div></label>
                        <button onmousedown="startRecording(0)" onmouseup="stopRecording()" ontouchstart="startRecording(0)" ontouchend="stopRecording()" class="btn-sm mic-btn">HOLD&RECORD</button>
                        <button onclick="previewAudio(0)" class="btn-sm play-btn">PRE-LISTEN</button>
                        <button onclick="deleteSlot(0)" class="btn-sm del-btn">DELETE</button>
                    </div>
                </div>

                <script>
                    for(let i=1; i<=4; i++) {
                        document.write(`
                            <div class="slot-card">
                                <h4>
                                    <span id="name-slot${i}">SLOT ${i}</span> 
                                    <span class="icon-btn" onclick="renameSlot(${i})" title="Rename Slot">✏️</span>
                                </h4>
                                <button id="btn-play-${i}" onclick="triggerSlot(${i})" class="btn-main-play">PLAY</button>
                                <div class="slot-controls">
                                    <label class="btn-sm" title="UPLOAD NEW"><div class="btn-sm-label" style="font-size: 1.1rem;">📁<input type="file" hidden accept="audio/mp3, audio/wav, audio/m4a, audio/x-m4a, audio/aac" onchange="uploadToSlot(event, ${i})"></div></label>
                                    <button onmousedown="startRecording(${i})" onmouseup="stopRecording()" ontouchstart="startRecording(${i})" ontouchend="stopRecording()" class="btn-sm mic-btn" style="font-size: 1.1rem;" title="HOLD TO RECORD">🎙️</button>
                                    <button onclick="previewAudio(${i})" class="btn-sm play-btn" style="font-size: 1.1rem;" title="PRE-LISTEN">🔊</button>
                                    <button onclick="deleteSlot(${i})" class="btn-sm del-btn" style="font-size: 1.1rem;" title="DELETE">🗑️</button>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
            <p id="upload-status" style="text-align:center; margin-top:15px; font-size:0.85em; font-weight: bold; height: 15px;"></p>
        </div>

        <div class="card">
            <div class="switch-container" style="margin-bottom: 15px;">
                <label class="switch"><input type="checkbox" id="periodic-toggle" onchange="saveSettings()"><span class="slider-toggle"></span></label>
                <span id="periodic-title">PERIODIC BEEP EVERY 30 SEC</span>
            </div>
            
            <div style="padding-left: 10px; border-left: 2px solid var(--text);">
                <div class="input-group">
                    <label>Interval (Sec):</label>
                    <input type="number" id="periodic-sec" value="30" min="1" onchange="updatePeriodicTitle(); saveSettings()">
                </div>
                <div class="input-group">
                    <label>Beep Length (Sec):</label>
                    <input type="number" id="periodic-len" value="0.1" step="0.1" min="0.1" onchange="saveSettings()">
                </div>

                <label style="margin-top: 15px;">BEEP FREQUENCY: <span id="pfreq-val">1000Hz</span></label>
                <input type="range" id="periodic-freq" min="300" max="2500" step="50" value="1000" onchange="saveSettings()">

                <label style="margin-top: 10px;">BEEP VOLUME: <span id="pvol-val">50%</span></label>
                <input type="range" id="periodic-vol" min="0" max="100" value="50" onchange="saveSettings()">
            </div>
        </div>

        <div class="card">
            <label style="margin-bottom: 15px;">SYSTEM LOGS</label>
            <div class="terminal" id="live-log">Loading system logs...</div>
            <button class="btn-outline" style="width: 100%; margin-bottom: 10px;" onclick="updateFirmware()">PULL LATEST GITHUB BUILD (OTA)</button>
            <button class="btn-outline" style="width: 100%; border-color: #000; color: #000;" onclick="logout()">LOG OUT / CLEAR CACHE</button>
            
            <div class="version-text">
                SYSTEM UPTIME: <span id="sys-uptime">0h 0m</span><br><br>
                <span id="fw-version">FW: 260401212454</span>
            </div>
        </div>
        
        <div style="text-align: center; font-family: monospace; font-size: 0.75rem; color: #888; margin-top: 20px; margin-bottom: 20px;">
            DESIGNED & ENGINEERED BY<br>
            <span style="color: var(--text); font-weight: bold; font-size: 0.9rem;">ROMAN GODISH</span><br>
            HFA • 2026
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            projectId: "untitledcafe-bfd05", 
            databaseURL: "https://untitledcafe-bfd05-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "untitledcafe-bfd05.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        let sessionPasscode = "";
        let validPinPayload = null; 

        window.onload = function() {
            const savedPin = localStorage.getItem("system_pin");
            if (savedPin) {
                document.getElementById('passcode-input').value = savedPin;
                login();
            }
        };

        function logToTerminal(msg) {
            const d = new Date();
            const timeStr = d.toTimeString().split(' ')[0];
            db.ref("system").update({
                latest_log: `[WEB - ${timeStr}] ${msg}`,
                auth_pin: validPinPayload
            }).catch(err => console.error("Log write failed:", err));
        }

        async function magicRefresh() {
            // Send a hard stop command to clear all tasks before refreshing
            await sendCommand("stop_alarm");
            location.reload(true);
        }

        async function login() {
            const btn = document.getElementById('auth-btn');
            const err = document.getElementById('auth-error');
            sessionPasscode = document.getElementById('passcode-input').value.trim();
            btn.innerText = "VERIFYING..."; err.style.display = 'none';

            try {
                try {
                    await db.ref("alarm_state").update({ auth_pin: sessionPasscode, last_ui_login: Date.now(), master_update_time: Date.now() });
                    validPinPayload = sessionPasscode; 
                } catch (stringError) {
                    const pinNum = Number(sessionPasscode);
                    if (isNaN(pinNum)) throw stringError; 
                    await db.ref("alarm_state").update({ auth_pin: pinNum, last_ui_login: Date.now(), master_update_time: Date.now() });
                    validPinPayload = pinNum; 
                }
                
                localStorage.setItem("system_pin", sessionPasscode); 
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                syncUI(); setupSystemMonitors();
            } catch (error) {
                btn.innerText = "AUTHENTICATE"; err.style.display = 'block';
                localStorage.removeItem("system_pin");
            }
        }

        async function sendCommand(action, payload = {}) {
            try {
                payload.auth_pin = validPinPayload; 
                payload.master_update_time = Date.now(); 

                if (action === "trigger_alarm") {
                    await db.ref("alarm_state").update({ trigger_time: Date.now(), duration: payload.duration, hold_trigger: false, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "hold_alarm") {
                    await db.ref("alarm_state").update({ hold_trigger: payload.active, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "stop_alarm") {
                    await db.ref("alarm_state").update({ stop_trigger: Date.now(), hold_trigger: false, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "update_settings") {
                    await db.ref("alarm_state").update(payload);
                } else if (action === "reboot_esp") {
                    await db.ref("alarm_state").update({ force_reboot: true, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "sync_firmware") {
                    await db.ref("system").update({ ota_url: payload.url, auth_pin: validPinPayload });
                }
            } catch (error) {
                alert("ACCESS DENIED or Network Error."); logout();
            }
        }

        function syncUI() {
            db.ref('alarm_state').on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    if(data.volume !== undefined) document.getElementById('volume').value = data.volume;
                    if(data.wav_volume !== undefined) document.getElementById('wav-volume').value = data.wav_volume;
                    if(data.siren_min !== undefined) document.getElementById('siren-min').value = data.siren_min;
                    if(data.siren_max !== undefined) document.getElementById('siren-max').value = data.siren_max;
                    if(data.siren_speed !== undefined) document.getElementById('siren-speed').value = data.siren_speed;
                    if(data.wobble_active !== undefined) document.getElementById('wobble-toggle').checked = data.wobble_active;
                    if(data.wobble_speed !== undefined) document.getElementById('wobble-speed').value = data.wobble_speed;
                    if(data.periodic_active !== undefined) document.getElementById('periodic-toggle').checked = data.periodic_active;
                    if(data.periodic_sec !== undefined) document.getElementById('periodic-sec').value = data.periodic_sec;
                    if(data.periodic_len !== undefined) document.getElementById('periodic-len').value = data.periodic_len;
                    if(data.periodic_freq !== undefined) document.getElementById('periodic-freq').value = data.periodic_freq;
                    if(data.periodic_vol !== undefined) document.getElementById('periodic-vol').value = data.periodic_vol;
                    if(data.amp_enabled !== undefined) document.getElementById('amp-toggle').checked = data.amp_enabled;
                    updateLabels();
                    updatePeriodicTitle();

                    for(let i=0; i<=4; i++) {
                        let slotKey = (i === 0) ? "horn" : `slot${i}`;
                        let nameEl = document.getElementById(`name-slot${i}`);
                        if(nameEl && data.slot_names && data.slot_names[slotKey]) {
                            nameEl.innerText = data.slot_names[slotKey];
                        }
                        
                        let btn = document.getElementById(`btn-play-${i}`);
                        if(btn) {
                            if(data.slots && data.slots[slotKey] && data.slots[slotKey].version !== -1 && data.slots[slotKey].version !== undefined) {
                                btn.innerText = "PLAY";
                                btn.style.opacity = "1";
                            } else {
                                btn.innerText = "EMPTY";
                                btn.style.opacity = "0.5";
                            }
                        }
                    }
                }
            });
        }

        function logout() { localStorage.removeItem("system_pin"); location.reload(); }

        function updateLabels() {
            document.getElementById('vol-val').innerText = document.getElementById('volume').value + '%';
            document.getElementById('wvol-val').innerText = document.getElementById('wav-volume').value + '%';
            document.getElementById('smin-val').innerText = document.getElementById('siren-min').value + 'Hz';
            document.getElementById('smax-val').innerText = document.getElementById('siren-max').value + 'Hz';
            document.getElementById('sspeed-val').innerText = document.getElementById('siren-speed').value;
            document.getElementById('wspeed-val').innerText = document.getElementById('wobble-speed').value;
            document.getElementById('pfreq-val').innerText = document.getElementById('periodic-freq').value + 'Hz';
            document.getElementById('pvol-val').innerText = document.getElementById('periodic-vol').value + '%';
        }
        document.querySelectorAll('input[type="range"]').forEach(el => { el.addEventListener('input', updateLabels); });

        function updatePeriodicTitle() {
            const sec = document.getElementById('periodic-sec').value;
            const len = document.getElementById('periodic-len').value;
            const freq = document.getElementById('periodic-freq').value;
            const vol = document.getElementById('periodic-vol').value;
            document.getElementById('periodic-title').innerText = `PERIODIC BEEP EVERY ${sec}s | ${len}s | ${freq}Hz | ${vol}%`;
        }

        async function saveSettings() {
            if (!validPinPayload) return;
            updatePeriodicTitle();
            await sendCommand("update_settings", {
                volume: parseInt(document.getElementById('volume').value),
                wav_volume: parseInt(document.getElementById('wav-volume').value),
                siren_min: parseInt(document.getElementById('siren-min').value),
                siren_max: parseInt(document.getElementById('siren-max').value),
                siren_speed: parseInt(document.getElementById('siren-speed').value),
                wobble_active: document.getElementById('wobble-toggle').checked, 
                wobble_speed: parseInt(document.getElementById('wobble-speed').value),
                periodic_active: document.getElementById('periodic-toggle').checked, 
                periodic_sec: parseInt(document.getElementById('periodic-sec').value),
                periodic_vol: parseInt(document.getElementById('periodic-vol').value), 
                periodic_freq: parseInt(document.getElementById('periodic-freq').value),
                periodic_len: parseFloat(document.getElementById('periodic-len').value), 
                amp_enabled: document.getElementById('amp-toggle').checked
            });
        }

        async function triggerAlarm(seconds) { await sendCommand("trigger_alarm", { duration: seconds }); }
        async function holdAlarm(state) { await sendCommand("hold_alarm", { active: state }); }
        async function stopAlarm() { await sendCommand("stop_alarm"); }
        async function rebootESP() { if(confirm("Are you sure you want to hard reset the ESP32?")) { await sendCommand("reboot_esp"); } }
        async function updateFirmware() {
            const url = prompt("Enter raw GitHub firmware URL (.bin):", "https://romixplay.github.io/esp32-alarm/firmware.bin");
            if(url) await sendCommand("sync_firmware", { url });
        }

        // --- SLOT MANAGEMENT ---
        async function renameSlot(slotID) {
            let currentName = document.getElementById(`name-slot${slotID}`).innerText;
            let newName = prompt("Enter new name (max 15 chars):", currentName);
            if(newName && newName.trim() !== "") {
                let slotKey = (slotID === 0) ? "horn" : `slot${slotID}`;
                await db.ref("alarm_state").update({
                    [`slot_names/${slotKey}`]: newName.substring(0, 15).toUpperCase(),
                    master_update_time: Date.now(),
                    auth_pin: validPinPayload
                });
                logToTerminal(`Renamed Slot ${slotID} to ${newName}`);
            }
        }

        function previewAudio(slotID) {
            let slotKey = (slotID === 0) ? "horn" : `slot${slotID}`;
            db.ref(`alarm_state/slots/${slotKey}/url`).once('value').then(snap => {
                const url = snap.val();
                if(url) {
                    const audio = new Audio(url);
                    audio.play();
                    logToTerminal(`Playing preview for Slot ${slotID} on local device.`);
                } else {
                    alert("This slot is empty!");
                }
            });
        }

        async function triggerSlot(slotID) {
            const btn = document.getElementById(`btn-play-${slotID}`);
            if (btn.innerText === "EMPTY") {
                alert("This slot is empty! Upload or Record audio first.");
                return;
            }
            await db.ref("alarm_state").update({ 
                active_slot: slotID, slot_trigger: Date.now(), auth_pin: validPinPayload, master_update_time: Date.now()
            });
            logToTerminal(`Triggered Playback on Slot ${slotID}.`);
        }

        async function deleteSlot(slotID) {
            if (!confirm(`Clear audio from Slot ${slotID}?`)) return;
            const slotName = slotID === 0 ? "horn" : `slot${slotID}`;
            
            await db.ref("alarm_state").update({
                [`slots/${slotName}/version`]: -1,
                master_update_time: Date.now(),
                auth_pin: validPinPayload
            });

            document.getElementById('upload-status').innerText = `Slot ${slotID} cleared.`;
            document.getElementById('upload-status').style.color = "var(--accent)";
            logToTerminal(`Deleted audio from Slot ${slotID}.`);
        }

        function uploadToSlot(event, slotID) {
            const file = event.target.files[0];
            if (file) convertAndUpload(file, slotID);
        }

        async function convertAndUpload(file, slotID) {
            const status = document.getElementById('upload-status');
            status.innerText = `Processing Audio for Slot ${slotID}...`;
            status.style.color = "orange";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const decodedAudio = await audioContext.decodeAudioData(arrayBuffer);

                if (decodedAudio.duration > 10.5) {
                    status.innerText = "Error: Audio exceeds 10s limit."; status.style.color = "red"; return;
                }

                // VOLUME GAIN BOOSTER: Amplifies audio by 250% before sending to ESP32
                const offlineCtx = new OfflineAudioContext(1, decodedAudio.duration * 8000, 8000);
                const source = offlineCtx.createBufferSource();
                source.buffer = decodedAudio; 
                
                const gainNode = offlineCtx.createGain();
                gainNode.gain.value = 2.5; 
                
                source.connect(gainNode); 
                gainNode.connect(offlineCtx.destination); 
                source.start();
                
                const resampledAudio = await offlineCtx.startRendering();
                const wavBlob = audioBufferToWav(resampledAudio);

                status.innerText = `Uploading Slot ${slotID} to Cloud...`;
                const slotName = (slotID === 0) ? "horn" : `slot${slotID}`;
                const storageRef = storage.ref(`audio/${slotName}.wav`);
                await storageRef.put(wavBlob);
                const downloadURL = await storageRef.getDownloadURL();

                await db.ref("alarm_state").update({
                    [`slots/${slotName}/url`]: downloadURL,
                    [`slots/${slotName}/version`]: Date.now(),
                    master_update_time: Date.now(),
                    auth_pin: validPinPayload
                });

                status.innerText = `Slot ${slotID} Synced successfully!`; status.style.color = "green";
                logToTerminal(`Uploaded new audio to Slot ${slotID}.`);
            } catch (e) {
                status.innerText = "Upload failed."; status.style.color = "red"; console.error(e);
                logToTerminal(`Upload failed for Slot ${slotID}. Check console.`);
            }
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels; const sampleRate = buffer.sampleRate;
            const format = 1; const bitDepth = 16;
            const result = new Float32Array(buffer.length); buffer.copyFromChannel(result, 0);
            const bufferLength = result.length * 2 + 44; const wavBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(wavBuffer);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + result.length * 2, true);
            writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, format, true); view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true); view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data'); view.setUint32(40, result.length * 2, true);
            let offset = 44;
            for (let i = 0; i < result.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, result[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        let mediaRecorder; let audioChunks = []; let currentRecordSlot = null; let recordStartTime = 0;

        async function startRecording(slotID) {
            try {
                currentRecordSlot = slotID;
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
                mediaRecorder.onstop = async () => {
                    // Accidental Press Guard: Must hold for at least 1 second (1000ms)
                    if (Date.now() - recordStartTime < 1000) {
                        document.getElementById('upload-status').innerText = "Hold longer to record.";
                        document.getElementById('upload-status').style.color = "red";
                        logToTerminal("Recording canceled: Held for less than 1 second.");
                        return;
                    }
                    if (audioChunks.length > 0 && currentRecordSlot !== null) {
                        const audioBlob = new Blob(audioChunks); convertAndUpload(audioBlob, currentRecordSlot);
                    }
                };
                recordStartTime = Date.now();
                mediaRecorder.start();
                document.getElementById('upload-status').innerText = `🔴 Recording Slot ${slotID} (Release to save)...`;
                document.getElementById('upload-status').style.color = "var(--accent)";
            } catch (err) { alert("Microphone access denied."); }
        }

        function stopRecording() { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); }

        let lastKnownPing = Date.now();

        function updateStatusBadge() {
            const statusBadge = document.getElementById('status-indicator');
            if (Date.now() - lastKnownPing > 20000) {
                statusBadge.className = "status-badge bg-red"; statusBadge.innerText = "OFFLINE";
            } else {
                statusBadge.className = "status-badge bg-green"; statusBadge.innerText = "ONLINE";
            }
        }

        function setupSystemMonitors() {
            let logHistory = [];
            db.ref('system/latest_log').on('value', (snapshot) => {
                if (snapshot.val()) {
                    logHistory.push(`> ${snapshot.val()}`);
                    if (logHistory.length > 50) logHistory.shift(); 
                    const logBox = document.getElementById('live-log');
                    logBox.innerHTML = logHistory.join('<br>');
                    logBox.scrollTop = logBox.scrollHeight; 
                }
            });
            
            db.ref('system/last_ping').on('value', (snapshot) => {
                const lastPing = snapshot.val();
                if (lastPing) {
                    lastKnownPing = lastPing;
                    updateStatusBadge();
                }
            });

            setInterval(updateStatusBadge, 3000);

            db.ref('system/uptime').on('value', (snapshot) => {
                const upSecs = snapshot.val();
                if (upSecs) {
                    const hours = Math.floor(upSecs / 3600); const minutes = Math.floor((upSecs % 3600) / 60);
                    document.getElementById('sys-uptime').innerText = `${hours}h ${minutes}m`;
                }
            });
        }
    </script>
</body>
