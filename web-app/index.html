<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" href="data:,">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <style>
        /* --- STITCH AESTHETIC REDESIGN --- */
        :root { 
            --bg-color: #fdf2f8; 
            --grid-color: #fbcfe8;
            --card-bg: #ffffff;
            --text-main: #000000; 
            --text-accent: #000000;
            --btn-solid: #e11d48;
            --btn-outline: #e11d48;
            --btn-purple: #9333ea;
            --btn-purple-light: #c084fc;
            --btn-pink-light: #f472b6;
            --terminal-bg: #374151;
            --terminal-text: #4ade80;
            --border-radius: 12px;
            --border-color: #3f3f46;
        }
        
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        input, .terminal { -webkit-user-select: text; user-select: text; } 
        
        body { 
            font-family: monospace; 
            background-color: var(--bg-color); 
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main); 
            padding: 0; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
        }
        
        /* AUTH SCREEN */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #auth-screen h2 { font-family: sans-serif; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; font-size: 1.5rem; margin-bottom: 20px;}
        #auth-screen input { padding: 15px; font-family: monospace; font-size: 1.5rem; text-align: center; border: 4px solid var(--btn-purple); border-radius: 30px; background: white; color: black; width: 250px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(147, 51, 234, 0.4); outline: none;}
        #auth-screen button { padding: 15px 20px; font-family: sans-serif; font-size: 1.2rem; cursor: pointer; background: var(--btn-solid); color: white; border: none; border-radius: 10px; font-weight: bold; width: 250px;}
        
        .container { max-width: 500px; width: 100%; display: none; padding: 20px 15px; }
        
        /* STICKY HEADER */
        .sticky-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(253, 242, 248, 0.95);
            backdrop-filter: blur(5px);
            padding: 15px 0 10px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .header-title { font-family: sans-serif; font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; text-align: center; }
        .header-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; gap: 8px;}
        
        /* STATUS & TOGGLES */
        .status-badge { padding: 6px 12px; font-weight: bold; border-radius: 20px; border: 2px solid transparent; font-size: 0.75rem; font-family: sans-serif; text-transform: uppercase; color: white;}
        .bg-grey { background-color: #94a3b8; }
        .bg-green { background-color: #10b981; }
        .bg-red { background-color: #ef4444; }

        .header-switch-group { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 0.7rem; }
        .btn-refresh { background: #e2e8f0; border: 2px solid var(--border-color); border-radius: 8px; padding: 6px 10px; font-family: sans-serif; font-weight: bold; font-size: 0.7rem; cursor: pointer; }
        .btn-refresh:active { background: #cbd5e1; }

        /* CARDS */
        .card { border: 2px solid var(--border-color); border-radius: var(--border-radius); padding: 15px; margin-bottom: 20px; background: var(--card-bg); }
        .card > label { font-family: sans-serif; font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 10px; text-transform: uppercase; }
        
        /* SLIDERS */
        input[type="range"] { width: 100%; cursor: pointer; margin-bottom: 10px; accent-color: #3b82f6; }
        
        /* BUTTONS */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-outline { background: var(--btn-purple-light); border: 2px solid var(--btn-purple); color: white; padding: 12px 5px; font-family: sans-serif; font-weight: bold; font-size: 0.75rem; cursor: pointer; border-radius: 8px; text-align: center; }
        .btn-outline:active { background: var(--btn-purple); }
        
        .btn-solid { background: var(--btn-purple); color: white; border: none; padding: 15px; font-family: sans-serif; font-weight: bold; width: 100%; cursor: pointer; text-align: center; border-radius: 8px; }
        .btn-solid:active { opacity: 0.8; }
        .btn-stop { background: var(--btn-pink-light); border: 2px solid var(--btn-solid); color: white; }
        .btn-stop:active { background: var(--btn-solid); }

        /* SWITCHES */
        .switch-container { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.8rem; font-family: sans-serif;}
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #94a3b8; transition: .3s; border-radius: 24px; border: 2px solid transparent; }
        .slider-toggle:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-toggle { background-color: var(--btn-purple); }
        input:checked + .slider-toggle:before { transform: translateX(20px); }

        details { padding: 10px; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 8px; margin-top: 15px; font-family: sans-serif; font-size: 0.85rem;}
        summary { font-weight: bold; cursor: pointer; outline: none; text-transform: uppercase; }
        
        /* TERMINAL */
        .terminal { background-color: var(--terminal-bg); color: var(--terminal-text); padding: 1rem; font-size: 0.8rem; height: 160px; overflow-y: auto; border-radius: 8px; margin-bottom: 15px; font-family: monospace; line-height: 1.4;}
        
        /* AUDIO LIBRARY GRID */
        #slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .slot-card { background: #f8fafc; border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; }
        .slot-card h4 { margin: 0 0 10px 0; font-family: sans-serif; font-size: 0.85rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase;}
        
        .btn-main-play { width: 100%; height: 40px; margin-bottom: 8px; background: white; border: 2px solid var(--border-color); border-radius: 6px; font-family: sans-serif; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn-main-play:active { background: var(--border-color); color: white; }

        .slot-controls { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; height: 34px;}
        .slot-edit-panel { display: flex; justify-content: space-between; gap: 6px; height: 34px; margin-top: 4px; padding-top: 6px; border-top: 1px dashed #cbd5e1;}

        .btn-sm { 
            flex: 1 1 0; height: 100%; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.65rem; background: var(--border-color); color: white; border: none; cursor: pointer; font-family: sans-serif; font-weight: bold; 
        }
        .btn-sm.mic-btn { background: #64748b; }
        .btn-sm.del-btn { background: var(--btn-solid); opacity: 0.8;}
        .btn-sm.play-btn { background: var(--btn-purple-light); }
        .btn-sm:active { opacity: 0.7; }
        .btn-sm-label { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; cursor: pointer; }
        
        .icon-btn { cursor: pointer; font-size: 0.9rem; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 3px 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;}
        
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-family: sans-serif; font-size: 0.8rem; font-weight: bold;}
        .input-group input[type="number"] { width: 80px; padding: 5px; font-family: monospace; font-size: 0.9rem; border-radius: 6px; border: 1px solid var(--border-color); text-align: center;}
        
        .sys-btn { background: #f1f5f9; border: 2px solid var(--border-color); color: var(--border-color); padding: 10px; font-family: sans-serif; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 8px;}
        .sys-btn:active { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="container" id="main-app">

                    <h4 style="color: var(--btn-solid); font-size: 1rem;">

                        <label class="btn-sm"><div class="btn-sm-label">UPLOAD</div><input type="file" hidden accept="audio/mp3, audio/wav, audio/m4a, audio/x-m4a, audio/aac" onchange="uploadToSlot(event, 0)"></label>
                        <button onmousedown="startRecording(0)" onmouseup="stopRecording()" ontouchstart="startRecording(0)" ontouchend="stopRecording()" class="btn-sm mic-btn">RECORD</button>

                <div style="margin-top: 15px;">
                    <button class="sys-btn" onclick="changePasscode()">CHANGE LOCAL PASSCODE</button>

    <script>
        const firebaseConfig = { 
            projectId: "untitledcafe-bfd05", 
            databaseURL: "https://untitledcafe-bfd05-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "untitledcafe-bfd05.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        let sessionPasscode = "";
        let validPinPayload = null; 
        
        // --- LOCAL STORAGE LOG HISTORY ---
        let logHistory = JSON.parse(localStorage.getItem("cafe_log_history")) || [];

        window.onload = function() {
            const savedPin = localStorage.getItem("system_pin");
            if (savedPin) {
                document.getElementById('passcode-input').value = savedPin;
                login();
            }
            renderLogs(); // Show saved logs immediately
        };

        function addLogToUI(msg) {
            logHistory.push(msg);
            if (logHistory.length > 50) logHistory.shift(); 
            localStorage.setItem("cafe_log_history", JSON.stringify(logHistory));
            renderLogs();
        }

        function renderLogs() {
            const logBox = document.getElementById('live-log');
            logBox.innerHTML = logHistory.join('<br>');
            logBox.scrollTop = logBox.scrollHeight; 
        }
        
        function clearLogs() {
            logHistory = [];
            localStorage.setItem("cafe_log_history", JSON.stringify(logHistory));
            renderLogs();
        }

        function logToTerminal(msg) {
            const d = new Date();
            const timeStr = d.toTimeString().split(' ')[0];
            const fullMsg = `[WEB - ${timeStr}] ${msg}`;
            addLogToUI(fullMsg); // Save locally
            db.ref("system").update({
                latest_log: fullMsg,
                auth_pin: validPinPayload
            }).catch(err => console.error("Log write failed:", err));
        }

        // Keep header and main toggles in sync
        function syncToggles(type) {
            if (type === 'amp') {
                const headerState = document.getElementById('amp-toggle-header').checked;
                window.ampStateBuffer = headerState; 
            } else if (type === 'beep') {
                const headerChecked = document.getElementById('periodic-toggle-header').checked;
                const mainChecked = document.getElementById('periodic-toggle').checked;
                // Determine which one was clicked by seeing which is out of sync with the other, then align them
                if (headerChecked !== mainChecked) {
                    document.getElementById('periodic-toggle-header').checked = headerChecked;
                    document.getElementById('periodic-toggle').checked = headerChecked;
                }
            }
        }

        async function magicRefresh() {
            logToTerminal("Executing Magic Refresh (Clearing all tasks)...");
            await sendCommand("stop_alarm");
            setTimeout(() => { location.reload(true); }, 500);
        }
        
        function changePasscode() {
            alert("NOTE: This only changes the passcode saved in your browser. If your Firebase Database Rules enforce a specific pin, you must change it in the Firebase Console as well.");
            localStorage.removeItem("system_pin");
            location.reload();
        }

        function toggleEdit(slotID) {
            const panel = document.getElementById(`edit-panel-${slotID}`);
            panel.style.display = panel.style.display === "none" ? "flex" : "none";
        }

        async function login() {
            const btn = document.getElementById('auth-btn');
            const err = document.getElementById('auth-error');
            sessionPasscode = document.getElementById('passcode-input').value.trim();
            btn.innerText = "VERIFYING..."; err.style.display = 'none';

            try {
                try {
                    await db.ref("alarm_state").update({ auth_pin: sessionPasscode, last_ui_login: Date.now(), master_update_time: Date.now() });
                    validPinPayload = sessionPasscode; 
                } catch (stringError) {
                    const pinNum = Number(sessionPasscode);
                    if (isNaN(pinNum)) throw stringError; 
                    await db.ref("alarm_state").update({ auth_pin: pinNum, last_ui_login: Date.now(), master_update_time: Date.now() });
                    validPinPayload = pinNum; 
                }
                
                localStorage.setItem("system_pin", sessionPasscode); 
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                syncUI(); setupSystemMonitors();
            } catch (error) {
                btn.innerText = "AUTHENTICATE"; err.style.display = 'block';
                localStorage.removeItem("system_pin");
            }
        }

        async function sendCommand(action, payload = {}) {
            try {
                payload.auth_pin = validPinPayload; 
                payload.master_update_time = Date.now(); 

                // Inject amp state if changed from header
                if (window.ampStateBuffer !== undefined) {
                    payload.amp_enabled = window.ampStateBuffer;
                }

                if (action === "trigger_alarm") {
                    await db.ref("alarm_state").update({ trigger_time: Date.now(), duration: payload.duration, hold_trigger: false, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "hold_alarm") {
                    await db.ref("alarm_state").update({ hold_trigger: payload.active, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "stop_alarm") {
                    await db.ref("alarm_state").update({ stop_trigger: Date.now(), hold_trigger: false, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "update_settings") {
                    await db.ref("alarm_state").update(payload);
                } else if (action === "reboot_esp") {
                    await db.ref("alarm_state").update({ force_reboot: true, auth_pin: validPinPayload, master_update_time: Date.now() });
                } else if (action === "sync_firmware") {
                    await db.ref("alarm_state").update({ ota_url: payload.url, auth_pin: validPinPayload, master_update_time: Date.now() });
                }
            } catch (error) {
                alert("ACCESS DENIED or Network Error."); logout();
            }
        }

        function syncUI() {
            db.ref('alarm_state').on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    if(data.volume !== undefined) document.getElementById('volume').value = data.volume;
                    if(data.wav_volume !== undefined) document.getElementById('wav-volume').value = data.wav_volume;
                    if(data.siren_min !== undefined) document.getElementById('siren-min').value = data.siren_min;
                    if(data.siren_max !== undefined) document.getElementById('siren-max').value = data.siren_max;
                    if(data.siren_speed !== undefined) document.getElementById('siren-speed').value = data.siren_speed;
                    
                    if(data.periodic_active !== undefined) {
                        document.getElementById('periodic-toggle').checked = data.periodic_active;
                        document.getElementById('periodic-toggle-header').checked = data.periodic_active;
                    }
                    if(data.periodic_sec !== undefined) document.getElementById('periodic-sec').value = data.periodic_sec;
                    if(data.periodic_len !== undefined) document.getElementById('periodic-len').value = data.periodic_len;
                    if(data.periodic_freq !== undefined) document.getElementById('periodic-freq').value = data.periodic_freq;
                    if(data.periodic_vol !== undefined) document.getElementById('periodic-vol').value = data.periodic_vol;
                    if(data.amp_enabled !== undefined) {
                        document.getElementById('amp-toggle-header').checked = data.amp_enabled;
                        window.ampStateBuffer = data.amp_enabled;
                    }
                    
                    updateLabels();
                    updatePeriodicTitle();

                    for(let i=0; i<=4; i++) {
                        let slotKey = (i === 0) ? "horn" : `slot${i}`;
                        let nameEl = document.getElementById(`name-slot${i}`);
                        if(nameEl && data.slot_names && data.slot_names[slotKey]) {
                            nameEl.innerText = data.slot_names[slotKey];
                        }
                        
                        let btn = document.getElementById(`btn-play-${i}`);
                        if(btn) {
                            if(data.slots && data.slots[slotKey] && data.slots[slotKey].version !== -1 && data.slots[slotKey].version !== undefined) {
                                btn.innerText = "PLAY";
                                btn.style.background = "var(--btn-solid)";
                                btn.style.color = "white";
                            } else {
                                btn.innerText = "EMPTY";
                                btn.style.background = "#f1f5f9";
                                btn.style.color = "#94a3b8";
                            }
                        }
                    }
                }
            });
        }

        function updateLabels() {
            document.getElementById('vol-val').innerText = document.getElementById('volume').value + '%';
            document.getElementById('wvol-val').innerText = document.getElementById('wav-volume').value + '%';
            document.getElementById('smin-val').innerText = document.getElementById('siren-min').value + 'Hz';
            document.getElementById('smax-val').innerText = document.getElementById('siren-max').value + 'Hz';
            document.getElementById('sspeed-val').innerText = document.getElementById('siren-speed').value;
            document.getElementById('pfreq-val').innerText = document.getElementById('periodic-freq').value + 'Hz';
            document.getElementById('pvol-val').innerText = document.getElementById('periodic-vol').value + '%';
        }
        document.querySelectorAll('input[type="range"]').forEach(el => { el.addEventListener('input', updateLabels); });

        function updatePeriodicTitle() {
            const sec = document.getElementById('periodic-sec').value;
            const len = document.getElementById('periodic-len').value;
            const freq = document.getElementById('periodic-freq').value;
            const vol = document.getElementById('periodic-vol').value;
            document.getElementById('periodic-title').innerText = `PERIODIC BEEP EVERY ${sec}s`;
        }

        async function saveSettings() {
            if (!validPinPayload) return;
            updatePeriodicTitle();
            await sendCommand("update_settings", {
                volume: parseInt(document.getElementById('volume').value),
                wav_volume: parseInt(document.getElementById('wav-volume').value),
                siren_min: parseInt(document.getElementById('siren-min').value),
                siren_max: parseInt(document.getElementById('siren-max').value),
                siren_speed: parseInt(document.getElementById('siren-speed').value),
                periodic_active: document.getElementById('periodic-toggle').checked, 
                periodic_sec: parseInt(document.getElementById('periodic-sec').value),
                periodic_vol: parseInt(document.getElementById('periodic-vol').value), 
                periodic_freq: parseInt(document.getElementById('periodic-freq').value),
                periodic_len: parseFloat(document.getElementById('periodic-len').value), 
                amp_enabled: document.getElementById('amp-toggle-header').checked
            });
        }

        async function triggerAlarm(seconds) { await sendCommand("trigger_alarm", { duration: seconds }); }
        async function holdAlarm(state) { await sendCommand("hold_alarm", { active: state }); }
        async function stopAlarm() { await sendCommand("stop_alarm"); }
        async function rebootESP() { if(confirm("Are you sure you want to hard reset the ESP32?")) { await sendCommand("reboot_esp"); } }
        async function updateFirmware() {
            const url = prompt("Enter raw GitHub firmware URL (.bin):", "https://romixplay.github.io/esp32-alarm/firmware.bin");
            if(url) await sendCommand("sync_firmware", { url });
        }

        async function renameSlot(slotID) {
            let currentName = document.getElementById(`name-slot${slotID}`).innerText;
            let newName = prompt("Enter new name (max 15 chars):", currentName);
            if(newName && newName.trim() !== "") {
                let slotKey = (slotID === 0) ? "horn" : `slot${slotID}`;
                await db.ref("alarm_state").update({
                    [`slot_names/${slotKey}`]: newName.substring(0, 15).toUpperCase(),
                    master_update_time: Date.now(),
                    auth_pin: validPinPayload
                });
                logToTerminal(`Renamed Slot ${slotID} to ${newName}`);
            }
        }

        function previewAudio(slotID) {
            let slotKey = (slotID === 0) ? "horn" : `slot${slotID}`;
            db.ref(`alarm_state/slots/${slotKey}/url`).once('value').then(snap => {
                const url = snap.val();
                if(url) {
                    const audio = new Audio(url);
                    audio.play();
                    logToTerminal(`Playing preview for Slot ${slotID} on local device.`);
                } else {
                    alert("This slot is empty!");
                }
            });
        }

        async function triggerSlot(slotID) {
            const btn = document.getElementById(`btn-play-${slotID}`);
            if (btn.innerText === "EMPTY") {
                alert("This slot is empty! Upload or Record audio first.");
                return;
            }
            await db.ref("alarm_state").update({ 
                active_slot: slotID, slot_trigger: Date.now(), auth_pin: validPinPayload, master_update_time: Date.now()
            });
            logToTerminal(`Triggered Playback on Slot ${slotID}.`);
        }

        async function deleteSlot(slotID) {
            if (!confirm(`Clear audio from Slot ${slotID}?`)) return;
            const slotName = slotID === 0 ? "horn" : `slot${slotID}`;
            
            await db.ref("alarm_state").update({
                [`slots/${slotName}/version`]: -1,
                master_update_time: Date.now(),
                auth_pin: validPinPayload
            });

            document.getElementById('upload-status').innerText = `Slot ${slotID} cleared.`;
            document.getElementById('upload-status').style.color = "var(--btn-solid)";
            logToTerminal(`Deleted audio from Slot ${slotID}.`);
            if(slotID !== 0) toggleEdit(slotID); // Close drawer
        }

        function uploadToSlot(event, slotID) {
            const file = event.target.files[0];
            if (file) convertAndUpload(file, slotID);
        }

        async function convertAndUpload(file, slotID) {
            const status = document.getElementById('upload-status');
            status.innerText = `Processing Audio for Slot ${slotID}...`;
            status.style.color = "orange";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const decodedAudio = await audioContext.decodeAudioData(arrayBuffer);

                if (decodedAudio.duration > 10.5) {
                    status.innerText = "Error: Audio exceeds 10s limit."; status.style.color = "red"; return;
                }

                // GAIN BOOSTER: 250% Volume Increase
                const offlineCtx = new OfflineAudioContext(1, decodedAudio.duration * 8000, 8000);
                const source = offlineCtx.createBufferSource();
                source.buffer = decodedAudio; 
                
                const gainNode = offlineCtx.createGain();
                gainNode.gain.value = 2.5; 
                
                source.connect(gainNode); 
                gainNode.connect(offlineCtx.destination); 
                source.start();
                
                const resampledAudio = await offlineCtx.startRendering();
                const wavBlob = audioBufferToWav(resampledAudio);

                status.innerText = `Uploading Slot ${slotID} to Cloud...`;
                const slotName = (slotID === 0) ? "horn" : `slot${slotID}`;
                const storageRef = storage.ref(`audio/${slotName}.wav`);
                await storageRef.put(wavBlob);
                const downloadURL = await storageRef.getDownloadURL();

                await db.ref("alarm_state").update({
                    [`slots/${slotName}/url`]: downloadURL,
                    [`slots/${slotName}/version`]: Date.now(),
                    master_update_time: Date.now(),
                    auth_pin: validPinPayload
                });

                status.innerText = `Slot ${slotID} Synced successfully!`; status.style.color = "green";
                logToTerminal(`Uploaded new audio to Slot ${slotID}.`);
                if(slotID !== 0) toggleEdit(slotID); // Close drawer
            } catch (e) {
                status.innerText = "Upload failed."; status.style.color = "red"; console.error(e);
                logToTerminal(`Upload failed for Slot ${slotID}. Check console.`);
            }
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels; const sampleRate = buffer.sampleRate;
            const format = 1; const bitDepth = 16;
            const result = new Float32Array(buffer.length); buffer.copyFromChannel(result, 0);
            const bufferLength = result.length * 2 + 44; const wavBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(wavBuffer);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + result.length * 2, true);
            writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, format, true); view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true); view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data'); view.setUint32(40, result.length * 2, true);
            let offset = 44;
            for (let i = 0; i < result.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, result[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        let mediaRecorder; let audioChunks = []; let currentRecordSlot = null; let recordStartTime = 0;

        async function startRecording(slotID) {
            try {
                currentRecordSlot = slotID;
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
                mediaRecorder.onstop = async () => {
                    if (Date.now() - recordStartTime < 1000) {
                        document.getElementById('upload-status').innerText = "Hold longer to record.";
                        document.getElementById('upload-status').style.color = "red";
                        logToTerminal("Recording canceled: Held for less than 1 second.");
                        return;
                    }
                    if (audioChunks.length > 0 && currentRecordSlot !== null) {
                        const audioBlob = new Blob(audioChunks); convertAndUpload(audioBlob, currentRecordSlot);
                    }
                };
                recordStartTime = Date.now();
                mediaRecorder.start();
                document.getElementById('upload-status').innerText = `🔴 Recording Slot ${slotID} (Release to save)...`;
                document.getElementById('upload-status').style.color = "var(--btn-solid)";
            } catch (err) { alert("Microphone access denied."); }
        }

        function stopRecording() { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); }

        let lastKnownPing = Date.now();

        function updateStatusBadge() {
            const statusBadge = document.getElementById('status-indicator');
            if (Date.now() - lastKnownPing > 20000) {
                statusBadge.className = "status-badge bg-red"; statusBadge.innerText = "● OFFLINE";
            } else {
                statusBadge.className = "status-badge bg-green"; statusBadge.innerText = "● ONLINE";
            }
        }

        function setupSystemMonitors() {
            db.ref('system/latest_log').on('value', (snapshot) => {
                if (snapshot.val()) {
                    addLogToUI(`> ${snapshot.val()}`);
                }
            });
            
            db.ref('system/last_ping').on('value', (snapshot) => {
                const lastPing = snapshot.val();
                if (lastPing) {
                    lastKnownPing = lastPing;
                    updateStatusBadge();
                }
            });

            setInterval(updateStatusBadge, 3000);

            db.ref('system/uptime').on('value', (snapshot) => {
                const upSecs = snapshot.val();
                if (upSecs) {
                    const hours = Math.floor(upSecs / 3600); const minutes = Math.floor((upSecs % 3600) / 60);
                    document.getElementById('sys-uptime').innerText = `${hours}h ${minutes}m`;
                }
            });
        }
    </script>
