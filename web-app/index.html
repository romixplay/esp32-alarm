<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTITLED // SAFE</title>
    <style>
        :root { --bg: #ececec; --text: #000000; --accent: #ff0000; --terminal-bg: #111; --terminal-text: #0f0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
        .container { border: 4px solid var(--text); padding: 2rem; width: 100%; max-width: 450px; box-shadow: 8px 8px 0px var(--text); background: #fff; }
        h1 { text-transform: uppercase; border-bottom: 2px solid var(--text); padding-bottom: 0.5rem; margin-top: 0; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; }
        .control-group { margin-bottom: 1.5rem; border: 2px solid var(--text); padding: 1rem; }
        label { font-weight: bold; display: block; margin-bottom: 0.5rem; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        input[type="range"] { width: 100%; margin-bottom: 1rem; }
        input[type="number"] { width: 60px; font-family: inherit; font-weight: bold; border: 2px solid var(--text); text-align: center; }
        button { background: transparent; border: 2px solid var(--text); padding: 0.75rem 1rem; font-family: inherit; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; margin-bottom: 0.5rem; transition: all 0.1s; user-select: none; }
        button:active:not(:disabled) { background: var(--text); color: var(--bg); transform: translate(2px, 2px); }
        button.danger { color: var(--accent); border-color: var(--accent); }
        button.danger:active:not(:disabled) { background: var(--accent); color: #fff; }
        button.hold-btn { background: var(--text); color: var(--bg); }
        button.hold-btn:active:not(:disabled) { background: var(--accent); border-color: var(--accent); }
        button:disabled { opacity: 0.5; cursor: not-allowed; border-color: #999; color: #999; }
        .terminal { background-color: var(--terminal-bg); color: var(--terminal-text); padding: 1rem; font-size: 0.85rem; height: 100px; overflow-y: auto; border: 2px solid var(--text); }
        .status-connecting { background: #888; color: #fff; }
        .status-online { background: #00cc00; color: #000; }
        .status-offline { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

    <div class="container">
    <div class="header">
        <h2>UNTITLED~SAFE</h2>
        <span class="status" id="status-badge">OFFLINE</span>
    </div>

    <div class="card">
        <label>MAIN VOLUME: <span id="vol-val">50%</span></label>
        <input type="range" id="volume" min="0" max="100" value="50" onchange="saveSettings()">
        
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--text);">
            <label>SIREN MIN FREQUENCY: <span id="smin-val">800Hz</span></label>
            <input type="range" id="siren-min" min="300" max="2500" step="50" value="800" onchange="saveSettings()">
            
            <label style="margin-top: 10px;">SIREN MAX FREQUENCY: <span id="smax-val">1600Hz</span></label>
            <input type="range" id="siren-max" min="300" max="2500" step="50" value="1600" onchange="saveSettings()">
            
            <label style="margin-top: 10px;">SIREN SWEEP SPEED: <span id="sspeed-val">10</span></label>
            <input type="range" id="siren-speed" min="1" max="50" value="10" onchange="saveSettings()">
        </div>
    </div>

    <div class="card">
        <label>MANUAL ALARM TRIGGER</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <button class="btn-outline" onclick="triggerAlarm(3)">SOUND (3s)</button>
            <button class="btn-outline" onclick="triggerAlarm(5)">SOUND (5s)</button>
            <button class="btn-outline" onclick="triggerAlarm(10)">SOUND (10s)</button>
            <button class="btn-outline" onclick="triggerAlarm(30)">SOUND (30s)</button>
        </div>
        <button class="btn-solid" id="btn-hold" onmousedown="holdAlarm(true)" onmouseup="holdAlarm(false)" onmouseleave="holdAlarm(false)" ontouchstart="holdAlarm(true)" ontouchend="holdAlarm(false)">HOLD TO PLAY</button>
    </div>

    <div class="card">
        <label style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="periodic-toggle" onchange="saveSettings()"> 
            <span id="periodic-title">PERIODIC BEEP EVERY 30 SEC</span>
        </label>
        
        <div style="margin-top: 15px; padding-left: 10px; border-left: 2px solid var(--text);">
            <label>Interval (Seconds):</label>
            <input type="number" id="periodic-sec" value="30" style="width: 100px; padding: 5px;" onchange="updatePeriodicTitle(); saveSettings()">
            
            <label style="margin-top: 10px;">Beep Length (Seconds):</label>
            <input type="number" id="periodic-len" value="0.1" step="0.1" style="width: 100px; padding: 5px;" onchange="saveSettings()">

            <label style="margin-top: 10px;">BEEP FREQUENCY: <span id="pfreq-val">1000Hz</span></label>
            <input type="range" id="periodic-freq" min="300" max="2500" step="50" value="1000" onchange="saveSettings()">

            <label style="margin-top: 10px;">BEEP VOLUME: <span id="pvol-val">50%</span></label>
            <input type="range" id="periodic-vol" min="0" max="100" value="50" onchange="saveSettings()">
        </div>
    </div>

    </div>

<script>
    // Link sliders to their text labels for visual feedback
    const ids = ['volume', 'siren-min', 'siren-max', 'siren-speed', 'periodic-freq', 'periodic-vol'];
    ids.forEach(id => {
        document.getElementById(id).addEventListener('input', function() {
            let val = this.value;
            if(id.includes('vol')) val += '%';
            else if(id.includes('freq') || id.includes('min') || id.includes('max')) val += 'Hz';
            document.getElementById(id.replace('volume', 'vol').split('-')[0].substring(0,5) + id.replace('volume', 'vol').split('-').pop() + '-val').innerText = val; // Quick hack to map IDs to labels
            updateLabels();
        });
    });

    function updateLabels() {
        document.getElementById('vol-val').innerText = document.getElementById('volume').value + '%';
        document.getElementById('smin-val').innerText = document.getElementById('siren-min').value + 'Hz';
        document.getElementById('smax-val').innerText = document.getElementById('siren-max').value + 'Hz';
        document.getElementById('sspeed-val').innerText = document.getElementById('siren-speed').value;
        document.getElementById('pfreq-val').innerText = document.getElementById('periodic-freq').value + 'Hz';
        document.getElementById('pvol-val').innerText = document.getElementById('periodic-vol').value + '%';
    }

    function updatePeriodicTitle() {
        document.getElementById('periodic-title').innerText = `PERIODIC BEEP EVERY ${document.getElementById('periodic-sec').value} SEC`;
    }

    async function saveSettings() {
        updatePeriodicTitle();
        await sendCommand("update_settings", {
            volume: parseInt(document.getElementById('volume').value),
            siren_min: parseInt(document.getElementById('siren-min').value),
            siren_max: parseInt(document.getElementById('siren-max').value),
            siren_speed: parseInt(document.getElementById('siren-speed').value),
            periodic_active: document.getElementById('periodic-toggle').checked,
            periodic_sec: parseInt(document.getElementById('periodic-sec').value),
            periodic_vol: parseInt(document.getElementById('periodic-vol').value),
            periodic_freq: parseInt(document.getElementById('periodic-freq').value),
            periodic_len: parseFloat(document.getElementById('periodic-len').value)
        });
    }

    // Update trigger functions to use new signatures
    async function triggerAlarm(seconds) { await sendCommand("trigger_alarm", { duration: seconds }); }
    async function holdAlarm(state) { await sendCommand("hold_alarm", { active: state }); }
    
    // ... Keep your existing sendCommand and setupLiveLogs functions ...
</script>
</body>
</html>
